services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?Set TELEGRAM_API_ID in .env}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?Set TELEGRAM_API_HASH in .env}
      TELEGRAM_LOCAL: "1"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    ports:
      - "8081:8081"
    networks:
      - downloader-net

  downloader-bot:
    build: .
    restart: unless-stopped
    depends_on:
      - telegram-bot-api
    env_file:
      - .env
    environment:
      DOWNLOAD_DIR: /app/downloads
      TELEGRAM_API_BASE_URL: http://telegram-bot-api:8081/bot
      TELEGRAM_API_BASE_FILE_URL: http://telegram-bot-api:8081/file/bot
      TELEGRAM_LOCAL_MODE: "true"
      MAX_DOWNLOAD_MB: ${MAX_DOWNLOAD_MB:-1900}
    volumes:
      - ./downloads:/app/downloads
      - ${HOST_INSTAGRAM_COOKIES_FILE:-./instagram-cookies.placeholder.txt}:${INSTAGRAM_COOKIES_FILE:-/app/cookies/instagram-cookies.txt}:ro
    networks:
      - downloader-net

volumes:
  telegram-bot-api-data:

networks:
  downloader-net:
